name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Restore dependencies
        run: dotnet restore AnonPulse.slnx

      - name: Build
        run: dotnet build AnonPulse.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AnonPulse.slnx --configuration Release --no-build --no-restore
