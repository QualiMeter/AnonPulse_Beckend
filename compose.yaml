services:
  db:
    image: postgres:17
    container_name: anonpulse-postgres

    environment:
      POSTGRES_USER: anonpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: anonpulse_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - anonpulse_pgdata:/var/lib/postgresql/data

volumes:
  anonpulse_pgdata:
